[Motorcycle]
# Motorcycle-specific controls will be declared here as the vehicle system grows.

[Camera]
# CAM07: detached free camera and vehicle-camera authoring navigation share
# these rebindable fly controls. Toggle Free Camera detaches the current
# rendered view from the car and pressing it again returns to chase camera.
Toggle Free Camera = Key:Grave
Camera Forward = Key:W
Camera Backward = Key:S
Camera Left = Key:A
Camera Right = Key:D
Camera Up = Key:E
Camera Down = Key:Q
Camera Fast = Key:LeftShift
Camera Slow = Key:LeftCtrl

