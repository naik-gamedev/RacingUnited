# Racing United module input actions
# Section headers become in-game input category tabs.
# Action Name = Default Binding | Additional Default Binding | ...
# Each action may expose up to eight equal binding slots.

[Common]
Confirm = Key:Space | Gamepad:A
Horn = Mouse:Right | Key:H | Gamepad:RightBumper

[Car]
Throttle = Key:W | Gamepad:RightTrigger+
Brake = Key:S | Gamepad:LeftTrigger+
Steer Left = Key:D | Gamepad:LeftX+
Steer Right = Key:A | Gamepad:LeftX-
Handbrake = Key:LeftShift | Gamepad:LeftBumper

[Gears]
# Sequential shifting keeps defaults. Direct gears are intentionally unbound
# so wheels/H-pattern shifters/button boxes can be assigned without stealing keys.
Shift Up = Key:E | Gamepad:Y
Shift Down = Key:Q | Gamepad:X
Clutch =
Select Neutral = Key:N
Select Reverse = Key:R
